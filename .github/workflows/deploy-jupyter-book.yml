name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter Book
        run: |
          python -m pip install --upgrade pip
          pip install jupyter-book==0.15.1

      - name: Build the book
        run: jupyter-book build jupyter-book

      - name: Debug build output paths
        run: |
          pwd
          ls -la
          find . -maxdepth 5 -type f -name index.html | sort

      - name: Publish built HTML to gh-pages
        run: |
          set -euo pipefail

          CANDIDATE_INDEX="$(find . -type f -path '*/_build/html/index.html' | head -n 1 || true)"
          if [[ -z "$CANDIDATE_INDEX" ]]; then
            echo "Could not locate generated index.html under any */_build/html path"
            find . -maxdepth 6 -type d -name html | sort
            exit 1
          fi

          BUILD_DIR="$(dirname "$CANDIDATE_INDEX")"
          echo "Using build directory: $BUILD_DIR"

          DEPLOY_DIR="$(mktemp -d)"

          test -d "$BUILD_DIR"
          test -f "$BUILD_DIR/index.html"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$DEPLOY_DIR"
          else
            git init "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git checkout -b gh-pages
            cd "$GITHUB_WORKSPACE"
          fi

          find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$BUILD_DIR"/. "$DEPLOY_DIR"/
          touch "$DEPLOY_DIR/.nojekyll"

          cd "$DEPLOY_DIR"
          git add --all
          git commit -m "deploy: ${GITHUB_SHA}" || {
            echo "No changes to publish"
            exit 0
          }
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
